# logprobs-highlighter bundle patch: mounts the provider plugin into the host
# composition of a dsh profile.
#
# Provider mode (no reverse proxy, no baseURL takeover): the plugin registers an
# llm provider route named `deepseek-logprobs` that calls DeepSeek's
# chat/completions with logprobs/top_logprobs, maps the SSE stream back to dsh
# StreamChunks, captures token-level probabilities in memory, mirrors the same
# data to JSONL under $DSH_HOME/logprobs-highlighter, and exposes
# /plugins/logprobs-highlighter/{status,tokens,debug,captures}.
#
# Install: `dsh plugin --profile web add "link:<project root>"`, then pick the
# "DeepSeek (logprobs)" provider in dsh's model selector.
- insert:
    - id: logprobs-highlighter
      # Node-resolvable package name — must stay in sync with package.json `name`.
      # Quoted because `@` is a reserved indicator in YAML.
      name: '@logprobs/logprobs-highlighter'
      config:
        enabled: true
        # DeepSeek OpenAI-compatible root; requests go to {baseUrl}/chat/completions.
        baseUrl: https://api.deepseek.com
        # Credential reference: resolved through dsh's credentials service first,
        # then the launching environment.
        apiKeyEnv: DEEPSEEK_API_KEY
        # logprobs: top_logprobs N (0 | 2 | 5 | 20).
        topLogprobs: 5
        # Explicit thinking mode (thinking.type=enabled).
        thinking: true
        # Default reasoning effort passed as reasoning_effort (low | high | max).
        reasoningEffort: high
        # Default output cap when the caller omits maxTokens.
        maxTokens: 8192
        # Claimed context window used by dsh capacity checks.
        defaultContextWindow: 1000000
        # In-memory ring buffer: entries / TTL.
        ringSize: 20
        ringTtlMs: 3600000
        # Assoc debug: print the sanitized first assistant/message event shape.
        debugAssoc: false
        # 红句 annotation：流结束后生成，初始 verdict=unsure；hover 可人工改判。
        annotationEnabled: true
        # sentence = 保存句子原文；none = 只保存 hash/offset/特征。
        annotationStoreText: sentence
        annotationMaxSentenceChars: 500
        annotationMaxFileBytes: 10485760
        annotationKeepFiles: 20
        # JSONL mirror: full capture (text + every token) or summary only.
        recordFull: true
        # Empty string = $DSH_HOME/logprobs-highlighter
        outputDir: ''
        maxFileBytes: 52428800
        keepFiles: 5